

name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
      
      - run: flutter create . --org com.pcshare --project-name pc_share_app
      
      # Yahan hum gradle version ko properly update karke lock kar rahe hain
      - name: Update Gradle Version for Java 21
        run: |
          PROPS="android/gradle/wrapper/gradle-wrapper.properties"
          echo "distributionBase=GRADLE_USER_HOME" > $PROPS
          echo "distributionPath=wrapper/dists" >> $PROPS
          echo "distributionUrl=https\://services.gradle.org/distributions/gradle-8.8-all.zip" >> $PROPS
          echo "networkTimeout=10000" >> $PROPS
          echo "validateDistributionUrl=true" >> $PROPS
          echo "zipStoreBase=GRADLE_USER_HOME" >> $PROPS
          echo "zipStorePath=wrapper/dists" >> $PROPS

      - run: flutter pub get
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
