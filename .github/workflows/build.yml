
name: Build Flutter APK

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
      
      - run: flutter create . --org com.pcshare --project-name pc_share_app
      
      # Yeh command Java aur Gradle version mismatch ko fix kar degi
      - run: cd android && ./gradlew wrapper --gradle-version 8.4 && cd ..
      
      - run: flutter pub get
      - run: flutter build apk --release
      
      - uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: build/app/outputs/flutter-apk/app-release.apk
